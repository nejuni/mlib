name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    # pinned so the label migration to a newer Ubuntu image can't change the build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_VERSION: 8.11.1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle (with retries and a mirror, services.gradle.org sometimes returns 504)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          F="gradle-${GRADLE_VERSION}-bin.zip"
          ok=0
          for url in \
            "https://services.gradle.org/distributions/${F}" \
            "https://github.com/gradle/gradle-distributions/releases/download/v${GRADLE_VERSION}/${F}" \
            "https://downloads.gradle.org/distributions/${F}"; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$F" "$url" \
               && unzip -tq "$F" > /dev/null 2>&1; then ok=1; break; fi
            echo "download failed from $url, trying next"
            rm -f "$F"
          done
          [ "$ok" = 1 ] || { echo "Could not download Gradle"; exit 1; }
          unzip -q "$F" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Install Android 16 (API 36) platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      # caching only: Gradle itself was installed above
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: gradle --version && gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: mlib-apk
          path: app/build/outputs/apk/release/*.apk
